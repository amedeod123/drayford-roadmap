<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Drayford — W27 Roadmap</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏱</text></svg>">
<style>
:root{
  --ground:#EEF0F2; --surface:#FFFFFF; --surface-2:#F6F7F9;
  --ink:#12171D; --ink-2:#3D4854; --ink-3:#6B7684;
  --rule:#D3D8DE; --rule-2:#E4E8EC;
  --marine:#134A72; --marine-soft:#E3ECF3;
  --oxide:#A93E1B; --oxide-soft:#F7E7E0;
  --teal:#186051; --teal-soft:#E0EEEA;
  --amber:#7A5606; --amber-soft:#F7EEDA;
  --shadow:0 1px 2px rgba(16,24,32,.06),0 8px 24px -12px rgba(16,24,32,.18);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0E1218; --surface:#161C24; --surface-2:#1C232D;
    --ink:#E6EAEF; --ink-2:#B3BCC7; --ink-3:#7E8B99;
    --rule:#2A333F; --rule-2:#222A34;
    --marine:#79ADD8; --marine-soft:#17293A;
    --oxide:#E4894F; --oxide-soft:#33211A;
    --teal:#5CBBA1; --teal-soft:#152B26;
    --amber:#D6A93F; --amber-soft:#2B2415;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --ground:#0E1218; --surface:#161C24; --surface-2:#1C232D;
  --ink:#E6EAEF; --ink-2:#B3BCC7; --ink-3:#7E8B99;
  --rule:#2A333F; --rule-2:#222A34;
  --marine:#79ADD8; --marine-soft:#17293A;
  --oxide:#E4894F; --oxide-soft:#33211A;
  --teal:#5CBBA1; --teal-soft:#152B26;
  --amber:#D6A93F; --amber-soft:#2B2415;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px; line-height:1.6; font-synthesis-weight:none;
}
.mono,code,kbd{font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
h1,h2,h3,h4{margin:0; line-height:1.15; text-wrap:balance; letter-spacing:-.02em; font-weight:800}
p{margin:0 0 .9em}
p:last-child{margin-bottom:0}
a{color:var(--marine)}
hr{border:0;border-top:1px solid var(--rule);margin:0}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
.narrow{max-width:760px}
.eyebrow{
  font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  font-size:11px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--ink-3); font-weight:600;
}
.num{font-variant-numeric:tabular-nums}

/* ---------- gate ---------- */
#gate{min-height:100vh;display:grid;place-items:center;padding:32px}
.gatecard{
  background:var(--surface);border:1px solid var(--rule);border-radius:4px;
  padding:36px 32px;max-width:440px;width:100%;box-shadow:var(--shadow);
}
.gatecard h1{font-size:22px;margin-bottom:6px;letter-spacing:-.01em}
.gatecard p{color:var(--ink-3);font-size:14px}
.gaterow{display:flex;gap:8px;margin-top:20px}
#pw{
  flex:1;padding:11px 13px;border:1px solid var(--rule);border-radius:3px;
  background:var(--surface-2);color:var(--ink);font-size:15px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
}
#pw:focus{outline:2px solid var(--marine);outline-offset:1px;border-color:transparent}
#go{
  padding:11px 20px;border:1px solid var(--marine);background:var(--marine);color:var(--ground);
  border-radius:3px;font-size:14px;font-weight:650;cursor:pointer;
}
#go:hover{filter:brightness(1.1)}
#err{color:var(--oxide);font-size:13px;margin-top:12px;min-height:18px}

/* ---------- masthead ---------- */
header.mast{
  background:var(--surface);border-bottom:1px solid var(--rule);
  padding:44px 0 0;
}
.mastgrid{display:grid;grid-template-columns:1fr;gap:28px}
@media(min-width:900px){.mastgrid{grid-template-columns:1.35fr .95fr;gap:48px;align-items:start}}
h1.title{font-size:clamp(34px,5.2vw,58px);letter-spacing:-.035em;line-height:1.02}
h1.title .sub{display:block;color:var(--ink-3);font-weight:700;font-size:clamp(15px,2vw,20px);letter-spacing:-.01em;margin-top:12px}
.deciders{margin-top:26px;display:grid;gap:10px}
.decider{
  display:flex;gap:12px;align-items:baseline;padding:13px 15px;
  background:var(--surface-2);border-left:3px solid var(--marine);border-radius:0 3px 3px 0;
}
.decider b{font-size:15px;font-weight:700}
.decider .qn{font-family:ui-monospace,monospace;font-size:11px;color:var(--ink-3);font-weight:700}

/* countdown */
.clock{
  background:var(--surface-2);border:1px solid var(--rule);border-radius:4px;padding:20px;
}
.clock .big{font-size:52px;font-weight:800;letter-spacing:-.04em;line-height:1;color:var(--oxide);font-variant-numeric:tabular-nums}
.clock .lbl{font-size:13px;color:var(--ink-2);margin-top:8px}
.clockrow{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--rule);margin-top:16px;padding-top:12px;font-size:12.5px}
.clockrow div{color:var(--ink-3)}
.clockrow b{display:block;color:var(--ink);font-family:ui-monospace,monospace;font-size:13px;font-weight:650;margin-top:2px}
.warnbar{
  margin-top:14px;padding:10px 12px;background:var(--amber-soft);border-radius:3px;
  font-size:12.5px;color:var(--ink-2);line-height:1.5;
}

/* nav */
nav.toc{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--rule);margin-top:44px}
nav.toc .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.toc .wrap::-webkit-scrollbar{display:none}
nav.toc a{
  padding:13px 12px;font-size:12.5px;color:var(--ink-3);text-decoration:none;white-space:nowrap;
  border-bottom:2px solid transparent;font-weight:600;
}
nav.toc a:hover{color:var(--ink);border-bottom-color:var(--rule)}
nav.toc a.crit{color:var(--oxide)}

/* ---------- sections ---------- */
section{padding:56px 0;border-bottom:1px solid var(--rule-2)}
.sechead{margin-bottom:28px}
.sechead h2{font-size:clamp(23px,3vw,31px);margin-top:7px}
.sechead .lede{color:var(--ink-2);font-size:16px;margin-top:12px;max-width:70ch}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:4px}

/* critical path chain */
ol.chain{list-style:none;margin:0;padding:0;counter-reset:c}
ol.chain li{
  counter-increment:c;position:relative;padding:0 0 22px 52px;
}
ol.chain li::before{
  content:counter(c,decimal-leading-zero);position:absolute;left:0;top:0;
  width:32px;height:32px;border-radius:50%;background:var(--marine);color:var(--ground);
  display:grid;place-items:center;font-family:ui-monospace,monospace;font-size:12px;font-weight:700;
}
ol.chain li::after{
  content:"";position:absolute;left:15.5px;top:34px;bottom:2px;width:1px;background:var(--rule);
}
ol.chain li:last-child{padding-bottom:0}
ol.chain li:last-child::after{display:none}
ol.chain li p{font-size:15.5px;padding-top:5px}

/* phases */
.phase{margin-bottom:20px;overflow:hidden}
.phasehead{padding:20px 22px;border-bottom:1px solid var(--rule);background:var(--surface-2)}
.phasehead .win{font-family:ui-monospace,monospace;font-size:12px;color:var(--oxide);font-weight:700;letter-spacing:.02em}
.phasehead h3{font-size:20px;margin:6px 0 8px}
.phasehead .goal{font-size:14.5px;color:var(--ink-2);max-width:80ch}
.streams{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.streams span{font-size:11.5px;padding:3px 9px;background:var(--surface);border:1px solid var(--rule);border-radius:99px;color:var(--ink-2)}
.ms{padding:16px 22px;border-bottom:1px solid var(--rule-2);display:grid;gap:8px}
.ms:last-of-type{border-bottom:0}
.mstop{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{font-family:ui-monospace,monospace;font-size:11px;font-weight:700;padding:3px 8px;border-radius:3px;letter-spacing:.02em;white-space:nowrap}
.pill.owner{background:var(--marine-soft);color:var(--marine)}
.pill.due{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--rule)}
.ms .txt{font-size:15px;font-weight:600;line-height:1.45}
.ms .why{font-size:13.5px;color:var(--ink-3);line-height:1.55;padding-left:11px;border-left:2px solid var(--rule)}
.gate{padding:16px 22px;background:var(--oxide-soft);font-size:13.5px;line-height:1.55}
.gate b{font-family:ui-monospace,monospace;font-size:12px;letter-spacing:.04em;color:var(--oxide);display:block;margin-bottom:5px}

/* task board */
.board{display:grid;gap:14px}
@media(min-width:820px){.board{grid-template-columns:repeat(3,1fr)}}
.col{background:var(--surface);border:1px solid var(--rule);border-radius:4px;overflow:hidden}
.colhead{padding:12px 15px;background:var(--surface-2);border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;align-items:baseline}
.colhead b{font-size:14px}
.colhead .n{font-family:ui-monospace,monospace;font-size:11px;color:var(--ink-3)}
.task{padding:12px 15px;border-bottom:1px solid var(--rule-2);display:flex;gap:10px;align-items:flex-start}
.task:last-child{border-bottom:0}
.task input{margin:3px 0 0;width:15px;height:15px;flex:none;accent-color:var(--teal);cursor:pointer}
.task label{cursor:pointer;font-size:13.5px;line-height:1.5}
.task .meta{display:flex;gap:7px;margin-top:6px;flex-wrap:wrap}
.task .meta span{font-family:ui-monospace,monospace;font-size:10.5px;padding:2px 6px;border-radius:2px;background:var(--surface-2);color:var(--ink-3);border:1px solid var(--rule-2)}
.task .meta span.d{color:var(--oxide)}
.task .blocks{font-size:12px;color:var(--ink-3);margin-top:6px;font-style:italic}
.task.done label{opacity:.42;text-decoration:line-through}

/* tables */
.tablewrap{overflow-x:auto;border:1px solid var(--rule);border-radius:4px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
th{
  text-align:left;padding:11px 14px;background:var(--surface-2);border-bottom:1px solid var(--rule);
  font-family:ui-monospace,monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:700;
}
td{padding:12px 14px;border-bottom:1px solid var(--rule-2);vertical-align:top}
tr:last-child td{border-bottom:0}
td.n{font-family:ui-monospace,monospace;font-variant-numeric:tabular-nums;white-space:nowrap}
td .today{color:var(--oxide);font-weight:650}
td .target{color:var(--teal);font-weight:650}
.tag{font-family:ui-monospace,monospace;font-size:10px;padding:2px 6px;border-radius:2px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.tag.lead{background:var(--teal-soft);color:var(--teal)}
.tag.lag{background:var(--marine-soft);color:var(--marine)}

/* risks */
.risk{padding:16px 18px;border-bottom:1px solid var(--rule-2)}
.risk:last-child{border-bottom:0}
.risk .rtop{display:flex;gap:9px;align-items:baseline;margin-bottom:7px}
.sev{font-family:ui-monospace,monospace;font-size:10px;font-weight:700;padding:2px 7px;border-radius:2px;text-transform:uppercase;letter-spacing:.07em;flex:none}
.sev.critical{background:var(--oxide);color:var(--ground)}
.sev.high{background:var(--oxide-soft);color:var(--oxide)}
.sev.medium{background:var(--amber-soft);color:var(--amber)}
.risk .rtxt{font-size:14.5px;font-weight:600;line-height:1.45}
.risk .mit{font-size:13.5px;color:var(--ink-2);margin-top:8px;padding-left:11px;border-left:2px solid var(--teal)}
.risk .mit b{color:var(--teal);font-family:ui-monospace,monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;display:block;margin-bottom:3px}

/* not doing */
ul.nogo{list-style:none;margin:0;padding:0;display:grid;gap:9px}
ul.nogo li{
  padding:13px 16px 13px 42px;background:var(--surface);border:1px solid var(--rule);border-radius:4px;
  font-size:14px;position:relative;line-height:1.55;
}
ul.nogo li::before{
  content:"✕";position:absolute;left:16px;top:13px;color:var(--oxide);font-weight:700;font-size:13px;
}

/* details */
details{background:var(--surface);border:1px solid var(--rule);border-radius:4px;margin-bottom:10px}
details[open]{box-shadow:var(--shadow)}
summary{padding:15px 18px;cursor:pointer;font-weight:650;font-size:15px;list-style:none;display:flex;gap:10px;align-items:flex-start}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸";color:var(--ink-3);flex:none;transition:transform .15s;font-size:13px;line-height:1.5}
details[open] summary::before{transform:rotate(90deg)}
.dbody{padding:0 18px 18px 40px}
.strat{font-size:13.5px;color:var(--ink-2);padding:11px 13px;background:var(--surface-2);border-radius:3px;margin-bottom:13px}
.strat b{font-family:ui-monospace,monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);display:block;margin-bottom:4px}
.draft{font-size:14.5px;line-height:1.65;border-left:3px solid var(--marine);padding-left:15px}

/* red team */
section.redteam{background:var(--ink);color:var(--ground);border-bottom:0}
section.redteam .eyebrow{color:#9AA6B4}
section.redteam h2{color:var(--ground)}
section.redteam .lede{color:#B6C0CC}
section.redteam .rt{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.11);border-radius:4px;padding:18px 20px;margin-bottom:12px}
section.redteam .rt h4{font-size:16px;margin-bottom:9px;color:#F5A97B}
section.redteam .rt p{font-size:14.5px;color:#C9D2DC;line-height:1.62}
section.redteam .rt p:last-child{margin-bottom:0}
section.redteam .fix{margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.11);font-size:13.5px;color:#9FE0C6}
section.redteam .fix b{font-family:ui-monospace,monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;display:block;margin-bottom:4px;color:#6FCBAA}
section.redteam .lever{background:#F5A97B;color:#1A1108;border-radius:4px;padding:22px 24px;margin-top:22px}
section.redteam .lever b{display:block;font-family:ui-monospace,monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:9px;opacity:.72}
section.redteam .lever p{color:#2A1B0C;font-size:16px;line-height:1.6;font-weight:600}

/* figure */
figure{margin:0}
figure svg{width:100%;height:auto;display:block;color:var(--ink)}
figcaption{font-size:13px;color:var(--ink-3);margin-top:12px;line-height:1.55}
.figbox{background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:22px;overflow-x:auto}

/* callout */
.callout{background:var(--marine-soft);border-radius:4px;padding:18px 20px;font-size:14.5px;line-height:1.6}
.callout b{color:var(--marine)}
.callout.warn{background:var(--amber-soft)}
.callout.warn b{color:var(--amber)}

/* fact grid */
.facts{display:grid;gap:12px}
@media(min-width:700px){.facts{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1000px){.facts{grid-template-columns:repeat(4,1fr)}}
.fact{background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:16px}
.fact .v{font-size:26px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.fact .k{font-size:12.5px;color:var(--ink-3);margin-top:6px;line-height:1.45}

footer{padding:40px 0 64px;color:var(--ink-3);font-size:13px}
footer .wrap{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between}
.hidden{display:none!important}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div id="gate">
  <div class="gatecard">
    <div class="eyebrow">Drayford Corporation</div>
    <h1 style="margin-top:10px">W27 Roadmap</h1>
    <p>Internal. Ask Amedeo for the passphrase.</p>
    <div class="gaterow">
      <input id="pw" type="password" placeholder="passphrase" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button id="go">Open</button>
    </div>
    <div id="err" role="status" aria-live="polite"></div>
  </div>
</div>

<main id="doc" class="hidden"></main>

const SALT="OCkRNMBoYqfmR0aHGXvjtA==", IV="x83aeiwFjeVKn9wX", ITER=310000;
const b642buf=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pass){
  const enc=new TextEncoder();
  const base=await crypto.subtle.importKey("raw",enc.encode(pass),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey(
    {name:"PBKDF2",salt:b642buf(SALT),iterations:ITER,hash:"SHA-256"},
    base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:b642buf(IV)},key,b642buf(PAYLOAD));
  return new TextDecoder().decode(plain);
}
async function attempt(){
  const pw=document.getElementById("pw").value.trim();
  const err=document.getElementById("err");
  if(!pw){err.textContent="";return}
  err.textContent="Decrypting…";
  try{
    const html=await unlock(pw);
    sessionStorage.setItem("dfw27",pw);
    document.getElementById("gate").remove();
    const doc=document.getElementById("doc");
    doc.innerHTML=html; doc.classList.remove("hidden");
    boot();
  }catch(e){ err.textContent="Wrong passphrase."; }
}
document.getElementById("go").addEventListener("click",attempt);
document.getElementById("pw").addEventListener("keydown",e=>{if(e.key==="Enter")attempt()});
(function(){const s=sessionStorage.getItem("dfw27"); if(s){document.getElementById("pw").value=s; attempt();} else {document.getElementById("pw").focus();}})();

function boot(){
  // countdown to the estimated W27 deadline: Mon Nov 9 2026, 20:00 PT (UTC-8)
  const target=Date.UTC(2026,10,10,4,0,0);
  const el=document.getElementById("cd"), sub=document.getElementById("cdsub");
  function tick(){
    if(!el) return;
    const d=target-Date.now();
    if(d<=0){el.textContent="0"; if(sub) sub.textContent="Estimated deadline passed"; return;}
    const days=Math.floor(d/86400000), hrs=Math.floor(d/3600000)%24;
    el.textContent=days;
    if(sub) sub.textContent=days+" days "+hrs+" hours to the estimated deadline";
  }
  tick(); setInterval(tick,60000);

  // task persistence
  const KEY="dfw27_tasks";
  let done={}; try{done=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
  document.querySelectorAll(".task input[type=checkbox]").forEach(cb=>{
    if(done[cb.id]){cb.checked=true; cb.closest(".task").classList.add("done");}
    cb.addEventListener("change",()=>{
      done[cb.id]=cb.checked;
      cb.closest(".task").classList.toggle("done",cb.checked);
      localStorage.setItem(KEY,JSON.stringify(done));
      counts();
    });
  });
  function counts(){
    document.querySelectorAll(".col").forEach(col=>{
      const all=col.querySelectorAll(".task input").length;
      const dn=col.querySelectorAll(".task input:checked").length;
      const n=col.querySelector(".n"); if(n) n.textContent=dn+"/"+all;
    });
  }
  counts();
}
</script>
